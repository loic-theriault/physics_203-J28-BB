<svg width="560" height="420" viewBox="0 0 560 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GJK Algorithm Flowchart -->

  <!-- Start -->
  <ellipse cx="280" cy="30" rx="80" ry="20" fill="#4A90D9" fill-opacity="0.15" stroke="#4A90D9" stroke-width="2"/>
  <text x="280" y="35" text-anchor="middle" font-family="serif" font-size="14" fill="#2A6AB0" font-weight="bold">Début : d = (1,0,0)</text>

  <line x1="280" y1="50" x2="280" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 1: Get first support point -->
  <rect x="160" y="75" width="240" height="40" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="280" y="95" text-anchor="middle" font-family="serif" font-size="13" fill="#333">S = support(A⊖B, d)</text>
  <text x="280" y="110" text-anchor="middle" font-family="serif" font-size="11" fill="#666">simplex = {S}, direction = -S</text>

  <line x1="280" y1="115" x2="280" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Loop start -->
  <text x="290" y="135" font-family="serif" font-size="12" fill="#888">↻ boucle</text>

  <!-- Step 2: Get next support -->
  <rect x="160" y="140" width="240" height="35" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="280" y="163" text-anchor="middle" font-family="serif" font-size="13" fill="#333">S = support(A⊖B, d)</text>

  <line x1="280" y1="175" x2="280" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Decision: S·d < 0? -->
  <polygon points="280,200 400,240 280,280 160,240" fill="#E8A838" fill-opacity="0.15" stroke="#E8A838" stroke-width="2"/>
  <text x="280" y="235" text-anchor="middle" font-family="serif" font-size="13" fill="#B07820" font-weight="bold">S · d &lt; 0 ?</text>
  <text x="280" y="252" text-anchor="middle" font-family="serif" font-size="11" fill="#666">(le point ne dépasse</text>
  <text x="280" y="265" text-anchor="middle" font-family="serif" font-size="11" fill="#666">pas l'origine)</text>

  <!-- Yes: no collision -->
  <line x1="400" y1="240" x2="470" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>
  <text x="425" y="232" font-family="serif" font-size="12" fill="#D44" font-weight="bold">OUI</text>
  <rect x="470" y="220" width="80" height="40" rx="5" fill="#D44" fill-opacity="0.12" stroke="#D44" stroke-width="2"/>
  <text x="510" y="245" text-anchor="middle" font-family="serif" font-size="13" fill="#A02020" font-weight="bold">Pas de</text>
  <text x="510" y="258" text-anchor="middle" font-family="serif" font-size="13" fill="#A02020" font-weight="bold">collision</text>

  <!-- No: continue -->
  <line x1="280" y1="280" x2="280" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>
  <text x="290" y="295" font-family="serif" font-size="12" fill="#2A8A2A" font-weight="bold">NON</text>

  <!-- Add to simplex -->
  <rect x="160" y="305" width="240" height="35" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="280" y="328" text-anchor="middle" font-family="serif" font-size="13" fill="#333">simplex.add(S)</text>

  <line x1="280" y1="340" x2="280" y2="355" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Decision: origin in simplex? -->
  <polygon points="280,360 400,385 280,410 160,385" fill="#2A8A2A" fill-opacity="0.15" stroke="#2A8A2A" stroke-width="2"/>
  <text x="280" y="388" text-anchor="middle" font-family="serif" font-size="13" fill="#2A8A2A" font-weight="bold">Origine ∈ simplex ?</text>

  <!-- Yes: collision -->
  <line x1="400" y1="385" x2="470" y2="385" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>
  <text x="425" y="377" font-family="serif" font-size="12" fill="#2A8A2A" font-weight="bold">OUI</text>
  <rect x="470" y="365" width="80" height="40" rx="5" fill="#2A8A2A" fill-opacity="0.12" stroke="#2A8A2A" stroke-width="2"/>
  <text x="510" y="383" text-anchor="middle" font-family="serif" font-size="13" fill="#2A8A2A" font-weight="bold">Collision</text>
  <text x="510" y="396" text-anchor="middle" font-family="serif" font-size="11" fill="#2A8A2A">→ EPA</text>

  <!-- No: update direction and loop -->
  <line x1="160" y1="385" x2="80" y2="385" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="385" x2="80" y2="158" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="158" x2="160" y2="158" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>
  <text x="100" y="378" font-family="serif" font-size="12" fill="#888" font-weight="bold">NON</text>
  <text x="50" y="270" font-family="serif" font-size="11" fill="#888" transform="rotate(-90 50 270)">update d (vers origine) → boucle</text>

  <defs>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
