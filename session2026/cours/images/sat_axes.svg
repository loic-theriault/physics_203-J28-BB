<svg width="560" height="340" viewBox="0 0 560 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- SAT: which axes to test — face normals of both polygons -->

  <!-- Two overlapping convex polygons -->
  <!-- Polygon A -->
  <polygon points="80,100 200,80 240,180 160,240 60,190" fill="#4A90D9" fill-opacity="0.12" stroke="#4A90D9" stroke-width="2.5"/>
  <text x="130" y="160" font-family="serif" font-size="20" fill="#2266AA" font-weight="bold">A</text>

  <!-- Polygon B -->
  <polygon points="280,120 400,90 440,200 360,260 260,210" fill="#D44" fill-opacity="0.12" stroke="#D44" stroke-width="2.5"/>
  <text x="340" y="185" font-family="serif" font-size="20" fill="#A02020" font-weight="bold">B</text>

  <!-- Face normals of A (blue, perpendicular to each edge) -->
  <!-- Edge 1: (80,100)->(200,80), normal points outward (up-right) -->
  <line x1="140" y1="90" x2="170" y2="50" stroke="#2266AA" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Edge 2: (200,80)->(240,180), normal points right -->
  <line x1="220" y1="130" x2="270" y2="115" stroke="#2266AA" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Edge 3: (240,180)->(160,240), normal points down-right -->
  <line x1="200" y1="210" x2="225" y2="260" stroke="#2266AA" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Edge 4: (160,240)->(60,190), normal points down-left -->
  <line x1="110" y1="215" x2="75" y2="260" stroke="#2266AA" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Edge 5: (60,190)->(80,100), normal points up-left -->
  <line x1="70" y1="145" x2="35" y2="120" stroke="#2266AA" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Face normals of B (red) -->
  <line x1="340" y1="105" x2="370" y2="65" stroke="#A02020" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="420" y1="145" x2="470" y2="130" stroke="#A02020" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="400" y1="230" x2="425" y2="280" stroke="#A02020" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="310" y1="235" x2="275" y2="280" stroke="#A02020" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="270" y1="165" x2="235" y2="140" stroke="#A02020" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Labels -->
  <text x="160" y="45" font-family="serif" font-size="13" fill="#2266AA">normales de A</text>
  <text x="370" y="60" font-family="serif" font-size="13" fill="#A02020">normales de B</text>

  <!-- Bottom explanation -->
  <rect x="30" y="295" width="500" height="35" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="280" y="318" text-anchor="middle" font-family="serif" font-size="14" fill="#333">On teste chaque normale de face comme axe de projection. Si une seule sépare → pas de collision.</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2266AA"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#A02020"/>
    </marker>
  </defs>
</svg>
