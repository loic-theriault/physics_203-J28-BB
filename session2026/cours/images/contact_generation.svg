<svg width="560" height="320" viewBox="0 0 560 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Contact Generation: point, normal, penetration depth -->

  <!-- Two overlapping shapes -->
  <!-- Shape A -->
  <polygon points="40,80 180,60 220,160 140,240 30,190" fill="#4A90D9" fill-opacity="0.2" stroke="#4A90D9" stroke-width="2.5"/>
  <text x="90" y="150" font-family="serif" font-size="20" fill="#2266AA" font-weight="bold">A</text>

  <!-- Shape B (overlapping) -->
  <polygon points="200,100 340,80 380,180 300,260 190,210" fill="#D44" fill-opacity="0.2" stroke="#D44" stroke-width="2.5"/>
  <text x="270" y="180" font-family="serif" font-size="20" fill="#A02020" font-weight="bold">B</text>

  <!-- Contact point -->
  <circle cx="200" cy="170" r="6" fill="#2A8A2A" stroke="black" stroke-width="2"/>
  <text x="210" y="165" font-family="serif" font-size="14" fill="#2A8A2A" font-weight="bold">P (point de contact)</text>

  <!-- Contact normal (from A to B) -->
  <line x1="200" y1="170" x2="320" y2="120" stroke="#2A8A2A" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="280" y="135" font-family="serif" font-size="16" fill="#2A8A2A" font-style="italic" font-weight="bold">n̂</text>
  <text x="280" y="155" font-family="serif" font-size="12" fill="#2A8A2A">normale de contact</text>

  <!-- Penetration depth (perpendicular to contact, showing overlap) -->
  <line x1="200" y1="170" x2="220" y2="240" stroke="#E8A838" stroke-width="2.5" marker-end="url(#arrowOrange)" marker-start="url(#arrowOrangeStart)"/>
  <text x="225" y="215" font-family="serif" font-size="14" fill="#B07820" font-weight="bold">depth</text>
  <text x="225" y="232" font-family="serif" font-size="11" fill="#B07820">(pénétration)</text>

  <!-- Right side: the three components -->
  <rect x="400" y="50" width="140" height="180" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="470" y="72" text-anchor="middle" font-family="serif" font-size="14" fill="#333" font-weight="bold">Contact = 3 infos</text>

  <circle cx="420" cy="100" r="5" fill="#2A8A2A"/>
  <text x="435" y="105" font-family="serif" font-size="13" fill="#333">Point P</text>

  <line x1="415" y1="130" x2="445" y2="120" stroke="#2A8A2A" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="455" y="125" font-family="serif" font-size="13" fill="#333">Normale n̂</text>

  <line x1="420" y1="160" x2="440" y2="180" stroke="#E8A838" stroke-width="2.5" marker-end="url(#arrowOrange)" marker-start="url(#arrowOrangeStart)"/>
  <text x="455" y="175" font-family="serif" font-size="13" fill="#333">Profondeur</text>

  <text x="470" y="210" text-anchor="middle" font-family="serif" font-size="11" fill="#666">Ces 3 infos alimentent</text>
  <text x="470" y="222" text-anchor="middle" font-family="serif" font-size="11" fill="#666">la Response (impulsion)</text>

  <!-- Bottom -->
  <text x="280" y="290" text-anchor="middle" font-family="serif" font-size="14" fill="#333" font-weight="bold">La Narrow Phase ne dit pas juste "oui/non" — elle calcule le contact complet.</text>
  <text x="280" y="308" text-anchor="middle" font-family="serif" font-size="13" fill="#666">Sans ces 3 valeurs, la Response (Session 6) ne peut pas appliquer d'impulsion.</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2A8A2A"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#E8A838"/>
    </marker>
    <marker id="arrowOrangeStart" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#E8A838"/>
    </marker>
  </defs>
</svg>
