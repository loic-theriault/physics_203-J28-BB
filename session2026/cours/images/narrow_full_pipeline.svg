<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full pipeline: from positions to resolved collision -->

  <!-- Step 1: Update positions -->
  <rect x="30" y="20" width="540" height="45" rx="6" fill="#4A90D9" fill-opacity="0.1" stroke="#4A90D9" stroke-width="2"/>
  <text x="50" y="48" font-family="serif" font-size="15" fill="#2A6AB0" font-weight="bold">1. Update Position</text>
  <text x="250" y="48" font-family="serif" font-size="14" fill="#444">P = P + V·dt</text>
  <text x="450" y="48" font-family="serif" font-size="13" fill="#666">(Euler / Verlet)</text>

  <line x1="300" y1="68" x2="300" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 2: Broad Phase -->
  <rect x="30" y="90" width="540" height="45" rx="6" fill="#4A90D9" fill-opacity="0.15" stroke="#4A90D9" stroke-width="2"/>
  <text x="50" y="118" font-family="serif" font-size="15" fill="#2A6AB0" font-weight="bold">2. Broad Phase</text>
  <text x="250" y="118" font-family="serif" font-size="14" fill="#444">AABB / Grille / SAP → paires candidates</text>
  <text x="500" y="118" font-family="serif" font-size="13" fill="#2A8A2A">~500k → ~2k</text>

  <line x1="300" y1="138" x2="300" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 3: Narrow Phase -->
  <rect x="30" y="160" width="540" height="45" rx="6" fill="#E8A838" fill-opacity="0.15" stroke="#E8A838" stroke-width="2"/>
  <text x="50" y="188" font-family="serif" font-size="15" fill="#B07820" font-weight="bold">3. Narrow Phase</text>
  <text x="250" y="188" font-family="serif" font-size="14" fill="#444">SAT / GJK → collision OUI/NON</text>
  <text x="500" y="188" font-family="serif" font-size="13" fill="#E8A838">~2k → ~200</text>

  <line x1="300" y1="208" x2="300" y2="225" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 4: Contact Generation -->
  <rect x="30" y="230" width="540" height="45" rx="6" fill="#E8A838" fill-opacity="0.2" stroke="#E8A838" stroke-width="2"/>
  <text x="50" y="258" font-family="serif" font-size="15" fill="#B07820" font-weight="bold">4. Contact Generation</text>
  <text x="250" y="258" font-family="serif" font-size="14" fill="#444">EPA → point + normale + profondeur</text>
  <text x="500" y="258" font-family="serif" font-size="13" fill="#666">(ce session)</text>

  <line x1="300" y1="278" x2="300" y2="295" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 5: Response -->
  <rect x="30" y="300" width="540" height="45" rx="6" fill="#D44" fill-opacity="0.12" stroke="#D44" stroke-width="2"/>
  <text x="50" y="328" font-family="serif" font-size="15" fill="#A02020" font-weight="bold">5. Response</text>
  <text x="250" y="328" font-family="serif" font-size="14" fill="#444">Impulsion + correction de position</text>
  <text x="500" y="328" font-family="serif" font-size="13" fill="#666">(Session 6)</text>

  <!-- Side label: this session -->
  <path d="M 580 160 L 575 155 L 580 160 L 575 165" stroke="#B07820" stroke-width="2.5" fill="none"/>
  <line x1="580" y1="160" x2="580" y2="275" stroke="#B07820" stroke-width="2.5"/>
  <path d="M 580 275 L 575 270 M 580 275 L 585 270" stroke="#B07820" stroke-width="2.5" fill="none"/>
  <text x="590" y="220" font-family="serif" font-size="12" fill="#B07820" font-weight="bold" transform="rotate(90 590 220)">Session 11</text>

  <defs>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
