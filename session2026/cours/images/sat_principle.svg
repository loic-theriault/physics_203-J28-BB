<svg width="620" height="340" viewBox="0 0 620 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- SAT Principle: two cases — separating axis found vs not found -->

  <!-- Case 1: Separating axis found (NO collision) -->
  <text x="160" y="25" text-anchor="middle" font-family="serif" font-size="16" fill="#2A8A2A" font-weight="bold">Axe séparateur trouvé → pas de collision</text>

  <!-- Polygon A (left) -->
  <polygon points="60,80 140,70 160,130 100,160 50,130" fill="#4A90D9" fill-opacity="0.2" stroke="#4A90D9" stroke-width="2.5"/>
  <text x="85" y="115" font-family="serif" font-size="18" fill="#2266AA" font-weight="bold">A</text>

  <!-- Polygon B (right, not touching) -->
  <polygon points="220,90 290,80 310,140 260,170 210,140" fill="#D44" fill-opacity="0.2" stroke="#D44" stroke-width="2.5"/>
  <text x="250" y="125" font-family="serif" font-size="18" fill="#A02020" font-weight="bold">B</text>

  <!-- Separating axis (horizontal dashed line) -->
  <line x1="20" y1="200" x2="320" y2="200" stroke="#2A8A2A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="195" font-family="serif" font-size="13" fill="#2A8A2A" font-style="italic">axe</text>

  <!-- Projections on axis -->
  <!-- A projection -->
  <line x1="60" y1="200" x2="160" y2="200" stroke="#4A90D9" stroke-width="6"/>
  <text x="90" y="220" font-family="serif" font-size="12" fill="#2266AA">proj(A)</text>

  <!-- B projection -->
  <line x1="210" y1="200" x2="310" y2="200" stroke="#D44" stroke-width="6"/>
  <text x="240" y="220" font-family="serif" font-size="12" fill="#A02020">proj(B)</text>

  <!-- Gap -->
  <line x1="160" y1="195" x2="210" y2="195" stroke="#2A8A2A" stroke-width="2" marker-end="url(#arrowGreen)" marker-start="url(#arrowGreenStart)"/>
  <text x="170" y="240" font-family="serif" font-size="13" fill="#2A8A2A" font-weight="bold">gap ✓</text>

  <!-- Divider -->
  <line x1="340" y1="20" x2="340" y2="320" stroke="#ddd" stroke-width="1.5"/>

  <!-- Case 2: No separating axis (collision) -->
  <text x="490" y="25" text-anchor="middle" font-family="serif" font-size="16" fill="#D44" font-weight="bold">Aucun axe séparateur → collision</text>

  <!-- Polygon A (overlapping) -->
  <polygon points="380,80 460,70 480,130 420,160 370,130" fill="#4A90D9" fill-opacity="0.2" stroke="#4A90D9" stroke-width="2.5"/>
  <text x="405" y="115" font-family="serif" font-size="18" fill="#2266AA" font-weight="bold">A</text>

  <!-- Polygon B (overlapping) -->
  <polygon points="440,90 510,80 530,140 480,170 430,140" fill="#D44" fill-opacity="0.2" stroke="#D44" stroke-width="2.5"/>
  <text x="475" y="125" font-family="serif" font-size="18" fill="#A02020" font-weight="bold">B</text>

  <!-- Axis 1 (horizontal) -->
  <line x1="360" y1="200" x2="600" y2="200" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="195" font-family="serif" font-size="11" fill="#888">axe 1</text>
  <line x1="380" y1="200" x2="480" y2="200" stroke="#4A90D9" stroke-width="6"/>
  <line x1="430" y1="200" x2="530" y2="200" stroke="#D44" stroke-width="6"/>
  <text x="440" y="220" font-family="serif" font-size="11" fill="#D44">chevauchement ✗</text>

  <!-- Axis 2 (vertical-ish) -->
  <line x1="360" y1="240" x2="600" y2="260" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="255" font-family="serif" font-size="11" fill="#888">axe 2</text>
  <line x1="395" y1="247" x2="475" y2="253" stroke="#4A90D9" stroke-width="6"/>
  <line x1="445" y1="250" x2="525" y2="257" stroke="#D44" stroke-width="6"/>
  <text x="450" y="280" font-family="serif" font-size="11" fill="#D44">chevauchement ✗</text>

  <!-- Conclusion -->
  <text x="490" y="310" text-anchor="middle" font-family="serif" font-size="14" fill="#D44" font-weight="bold">Tous les axes chevauchent → collision confirmée</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2A8A2A"/>
    </marker>
    <marker id="arrowGreenStart" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#2A8A2A"/>
    </marker>
  </defs>
</svg>
