<svg width="500" height="350" viewBox="0 0 500 350" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Ball -->
  <circle cx="250" cy="200" r="60" fill="#737070" stroke="black" stroke-width="2"/>
  <!-- Texture to show rotation -->
  <path d="M 250 140 L 250 260 M 190 200 L 310 200" stroke="#555" stroke-width="1.5"/>
  <circle cx="250" cy="200" r="4" fill="#2266AA"/>
  <text x="260" y="195" font-family="serif" font-size="16" fill="#2266AA" font-style="italic">G</text>

  <!-- Center hit (h=0): no torque, pure translation -->
  <line x1="100" y1="200" x2="185" y2="200" stroke="#D44" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="110" y="190" font-family="serif" font-size="14" fill="#D44">F (h=0)</text>
  <text x="110" y="225" font-family="serif" font-size="13" fill="#666">τ = 0, pas de rotation</text>

  <!-- High hit (h>0): top spin -->
  <line x1="100" y1="160" x2="195" y2="160" stroke="#D44" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="110" y="150" font-family="serif" font-size="14" fill="#D44">F (h>0)</text>
  <text x="110" y="135" font-family="serif" font-size="13" fill="#666">τ > 0, rotation "top spin"</text>

  <!-- r vector for high hit -->
  <line x1="250" y1="200" x2="250" y2="160" stroke="#888" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
  <text x="230" y="180" font-family="serif" font-size="14" fill="#888" font-style="italic">r</text>

  <!-- Low hit (h<0): back spin -->
  <line x1="100" y1="240" x2="195" y2="240" stroke="#D44" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="110" y="260" font-family="serif" font-size="14" fill="#D44">F (h&lt;0)</text>
  <text x="110" y="275" font-family="serif" font-size="13" fill="#666">τ &lt; 0, rotation "back spin"</text>

  <!-- r vector for low hit -->
  <line x1="250" y1="200" x2="250" y2="240" stroke="#888" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

  <!-- Resulting rotations -->
  <!-- Top spin: forward rotation -->
  <path d="M 250 145 A 55 55 0 0 1 305 200" stroke="#2A8A2A" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="320" y="170" font-family="serif" font-size="16" fill="#2A8A2A" font-style="italic">ω</text>

  <!-- Back spin: backward rotation -->
  <path d="M 250 255 A 55 55 0 0 0 305 200" stroke="#2A8A2A" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="320" y="250" font-family="serif" font-size="16" fill="#2A8A2A" font-style="italic">ω</text>

  <!-- Formula -->
  <text x="150" y="320" font-family="serif" font-size="18" fill="#333">τ = r × F → ω = τ / I</text>

  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D44"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2A8A2A"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
