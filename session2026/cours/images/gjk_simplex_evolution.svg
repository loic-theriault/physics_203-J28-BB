<svg width="620" height="340" viewBox="0 0 620 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GJK Simplex Evolution: point → line → triangle → tetrahedron (3D) -->

  <!-- Step 1: Point -->
  <text x="80" y="25" text-anchor="middle" font-family="serif" font-size="14" fill="#333" font-weight="bold">Étape 1 : Point</text>
  <text x="80" y="42" text-anchor="middle" font-family="serif" font-size="11" fill="#666">1 support dans direction d</text>

  <!-- Minkowski outline (faded) -->
  <polygon points="20,80 140,70 160,170 100,220 30,180" fill="#2A8A2A" fill-opacity="0.05" stroke="#2A8A2A" stroke-width="1" stroke-dasharray="3 2" opacity="0.4"/>
  <!-- Origin -->
  <circle cx="80" cy="150" r="4" fill="#D44"/>
  <text x="85" y="145" font-family="serif" font-size="11" fill="#D44">(0,0)</text>
  <!-- Simplex point -->
  <circle cx="140" cy="70" r="6" fill="#2266AA" stroke="black" stroke-width="1.5"/>
  <text x="145" y="65" font-family="serif" font-size="12" fill="#2266AA">S₁</text>
  <!-- Direction to origin -->
  <line x1="140" y1="70" x2="80" y2="150" stroke="#2A8A2A" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>


  <!-- Step 2: Line segment -->
  <text x="240" y="25" text-anchor="middle" font-family="serif" font-size="14" fill="#333" font-weight="bold">Étape 2 : Segment</text>
  <text x="240" y="42" text-anchor="middle" font-family="serif" font-size="11" fill="#666">2 supports → ligne</text>

  <polygon points="180,80 300,70 320,170 260,220 190,180" fill="#2A8A2A" fill-opacity="0.05" stroke="#2A8A2A" stroke-width="1" stroke-dasharray="3 2" opacity="0.4"/>
  <circle cx="240" cy="150" r="4" fill="#D44"/>
  <text x="245" y="145" font-family="serif" font-size="11" fill="#D44">(0,0)</text>
  <!-- Line segment -->
  <line x1="300" y1="70" x2="200" y2="180" stroke="#2266AA" stroke-width="3"/>
  <circle cx="300" cy="70" r="5" fill="#2266AA" stroke="black" stroke-width="1.5"/>
  <circle cx="200" cy="180" r="5" fill="#2266AA" stroke="black" stroke-width="1.5"/>
  <text x="305" y="65" font-family="serif" font-size="11" fill="#2266AA">S₁</text>
  <text x="180" y="195" font-family="serif" font-size="11" fill="#2266AA">S₂</text>
  <!-- Closest point on segment to origin -->
  <line x1="240" y1="150" x2="220" y2="160" stroke="#2A8A2A" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>


  <!-- Step 3: Triangle -->
  <text x="400" y="25" text-anchor="middle" font-family="serif" font-size="14" fill="#333" font-weight="bold">Étape 3 : Triangle</text>
  <text x="400" y="42" text-anchor="middle" font-family="serif" font-size="11" fill="#666">3 supports → triangle 2D</text>

  <polygon points="340,80 460,70 480,170 420,220 350,180" fill="#2A8A2A" fill-opacity="0.05" stroke="#2A8A2A" stroke-width="1" stroke-dasharray="3 2" opacity="0.4"/>
  <circle cx="400" cy="150" r="4" fill="#D44"/>
  <text x="405" y="145" font-family="serif" font-size="11" fill="#D44">(0,0)</text>
  <!-- Triangle simplex -->
  <polygon points="460,70 380,90 360,200" fill="#2266AA" fill-opacity="0.15" stroke="#2266AA" stroke-width="2.5"/>
  <circle cx="460" cy="70" r="5" fill="#2266AA" stroke="black" stroke-width="1.5"/>
  <circle cx="380" cy="90" r="5" fill="#2266AA" stroke="black" stroke-width="1.5"/>
  <circle cx="360" cy="200" r="5" fill="#2266AA" stroke="black" stroke-width="1.5"/>
  <text x="465" y="65" font-family="serif" font-size="11" fill="#2266AA">S₁</text>
  <text x="365" y="85" font-family="serif" font-size="11" fill="#2266AA">S₂</text>
  <text x="345" y="215" font-family="serif" font-size="11" fill="#2266AA">S₃</text>


  <!-- Step 4: Tetrahedron (3D) -->
  <text x="540" y="25" text-anchor="middle" font-family="serif" font-size="14" fill="#333" font-weight="bold">Étape 4 : Tétraèdre</text>
  <text x="540" y="42" text-anchor="middle" font-family="serif" font-size="11" fill="#666">4 supports → 3D, enclose origin?</text>

  <!-- Tetrahedron (simplified 2D projection) -->
  <polygon points="500,80 590,100 560,200 480,190" fill="#2266AA" fill-opacity="0.15" stroke="#2266AA" stroke-width="2.5"/>
  <line x1="540" y1="140" x2="500" y2="80" stroke="#2266AA" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="500" cy="80" r="5" fill="#2266AA" stroke="black" stroke-width="1.5"/>
  <circle cx="590" cy="100" r="5" fill="#2266AA" stroke="black" stroke-width="1.5"/>
  <circle cx="560" cy="200" r="5" fill="#2266AA" stroke="black" stroke-width="1.5"/>
  <circle cx="480" cy="190" r="5" fill="#2266AA" stroke="black" stroke-width="1.5"/>
  <circle cx="540" cy="140" r="4" fill="#D44"/>
  <text x="545" y="135" font-family="serif" font-size="11" fill="#D44">(0,0)</text>
  <text x="540" y="230" text-anchor="middle" font-family="serif" font-size="11" fill="#2A8A2A" font-weight="bold">Origine à l'intérieur?</text>


  <!-- Bottom: algorithm flow -->
  <rect x="20" y="260" width="580" height="70" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="310" y="282" text-anchor="middle" font-family="serif" font-size="14" fill="#333" font-weight="bold">Algorithme GJK :</text>
  <text x="310" y="302" text-anchor="middle" font-family="serif" font-size="13" fill="#444">1. Support initial → 2. Étendre le simplex vers l'origine → 3. L'origine est-elle contenue ?</text>
  <text x="310" y="320" text-anchor="middle" font-family="serif" font-size="13" fill="#444">Si oui → collision. Si non (le simplex ne peut plus grandir) → pas de collision.</text>

  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2A8A2A"/>
    </marker>
  </defs>
</svg>
