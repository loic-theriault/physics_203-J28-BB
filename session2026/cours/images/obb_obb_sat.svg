<svg width="560" height="300" viewBox="0 0 560 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- OBB vs OBB: oriented bounding boxes with different orientations -->

  <!-- OBB A (rotated 20 degrees) -->
  <g transform="rotate(-20 160 130)">
    <rect x="80" y="80" width="160" height="100" fill="#4A90D9" fill-opacity="0.15" stroke="#4A90D9" stroke-width="2.5"/>
    <text x="140" y="140" font-family="serif" font-size="18" fill="#2266AA" font-weight="bold">A (OBB)</text>
    <!-- Local axes of A -->
    <line x1="160" y1="130" x2="240" y2="130" stroke="#2266AA" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="230" y="125" font-family="serif" font-size="12" fill="#2266AA">x_A</text>
    <line x1="160" y1="130" x2="160" y2="80" stroke="#2266AA" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="165" y="85" font-family="serif" font-size="12" fill="#2266AA">y_A</text>
  </g>

  <!-- OBB B (rotated 35 degrees) -->
  <g transform="rotate(35 380 140)">
    <rect x="320" y="90" width="140" height="90" fill="#D44" fill-opacity="0.15" stroke="#D44" stroke-width="2.5"/>
    <text x="370" y="145" font-family="serif" font-size="18" fill="#A02020" font-weight="bold">B (OBB)</text>
    <!-- Local axes of B -->
    <line x1="390" y1="135" x2="460" y2="135" stroke="#A02020" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="450" y="130" font-family="serif" font-size="12" fill="#A02020">x_B</text>
    <line x1="390" y1="135" x2="390" y2="90" stroke="#A02020" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="395" y="95" font-family="serif" font-size="12" fill="#A02020">y_B</text>
  </g>

  <!-- 15 axes explanation -->
  <rect x="30" y="220" width="500" height="70" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="245" font-family="serif" font-size="14" fill="#333" font-weight="bold">En 3D, SAT teste 15 axes pour OBB vs OBB :</text>
  <text x="50" y="265" font-family="serif" font-size="13" fill="#2266AA">• 3 normales de faces de A (x_A, y_A, z_A)</text>
  <text x="50" y="282" font-family="serif" font-size="13" fill="#A02020">• 3 normales de faces de B (x_B, y_B, z_B)</text>
  <text x="300" y="265" font-family="serif" font-size="13" fill="#2A8A2A">• 9 produits vectoriels (x_A×x_B, x_A×y_B, ...)</text>
  <text x="300" y="282" font-family="serif" font-size="13" fill="#666">Total = 3 + 3 + 9 = 15 axes à tester</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2266AA"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#A02020"/>
    </marker>
  </defs>
</svg>
