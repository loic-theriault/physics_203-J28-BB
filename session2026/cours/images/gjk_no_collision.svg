<svg width="560" height="300" viewBox="0 0 560 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GJK: no collision case — origin outside Minkowski difference -->

  <!-- Minkowski difference shape -->
  <polygon points="80,60 240,50 300,150 250,240 100,220 40,140" fill="#2A8A2A" fill-opacity="0.1" stroke="#2A8A2A" stroke-width="2.5"/>
  <text x="140" y="150" font-family="serif" font-size="18" fill="#2A8A2A" font-weight="bold">A ⊖ B</text>

  <!-- Origin (OUTSIDE the shape) -->
  <circle cx="400" cy="140" r="6" fill="#D44" stroke="black" stroke-width="2"/>
  <text x="410" y="135" font-family="serif" font-size="16" fill="#D44" font-weight="bold">(0,0)</text>

  <!-- Simplex trying to reach origin but can't -->
  <polygon points="100,220 240,50 300,150" fill="#2266AA" fill-opacity="0.15" stroke="#2266AA" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="100" cy="220" r="4" fill="#2266AA"/>
  <circle cx="240" cy="50" r="4" fill="#2266AA"/>
  <circle cx="300" cy="150" r="4" fill="#2266AA"/>

  <!-- Direction from simplex towards origin (but support goes away) -->
  <line x1="250" y1="140" x2="390" y2="140" stroke="#2A8A2A" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="300" y="130" font-family="serif" font-size="13" fill="#2A8A2A">d (vers origine)</text>

  <!-- But the support point in that direction is already in the simplex -->
  <circle cx="300" cy="150" r="7" fill="none" stroke="#D44" stroke-width="2.5"/>
  <text x="310" y="170" font-family="serif" font-size="12" fill="#D44">S(d) déjà dans simplex</text>

  <!-- Conclusion -->
  <rect x="30" y="260" width="500" height="30" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="280" y="280" text-anchor="middle" font-family="serif" font-size="14" fill="#D44" font-weight="bold">Si le support dans la direction de l'origine est déjà dans le simplex → l'origine est hors A⊖B → pas de collision.</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2A8A2A"/>
    </marker>
  </defs>
</svg>
