<svg width="580" height="360" viewBox="0 0 580 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- SAT projection detail: showing how projection works on one axis -->

  <!-- Two polygons -->
  <polygon points="60,80 180,60 220,160 140,220 40,170" fill="#4A90D9" fill-opacity="0.15" stroke="#4A90D9" stroke-width="2.5"/>
  <text x="100" y="140" font-family="serif" font-size="18" fill="#2266AA" font-weight="bold">A</text>

  <polygon points="300,100 420,70 460,180 380,240 280,190" fill="#D44" fill-opacity="0.15" stroke="#D44" stroke-width="2.5"/>
  <text x="350" y="165" font-family="serif" font-size="18" fill="#A02020" font-weight="bold">B</text>

  <!-- Axis to test (diagonal) -->
  <line x1="20" y1="280" x2="540" y2="100" stroke="#2A8A2A" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="520" y="95" font-family="serif" font-size="14" fill="#2A8A2A" font-style="italic">n̂ (axe testé)</text>

  <!-- Projection lines from polygon A vertices to axis -->
  <line x1="60" y1="80" x2="155" y2="237" stroke="#2266AA" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="180" y1="60" x2="232" y2="252" stroke="#2266AA" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="220" y1="160" x2="265" y2="180" stroke="#2266AA" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="140" y1="220" x2="195" y2="207" stroke="#2266AA" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="40" y1="170" x2="120" y2="233" stroke="#2266AA" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Projection lines from polygon B vertices -->
  <line x1="300" y1="100" x2="335" y2="192" stroke="#A02020" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="420" y1="70" x2="412" y2="207" stroke="#A02020" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="460" y1="180" x2="445" y2="135" stroke="#A02020" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="380" y1="240" x2="375" y2="162" stroke="#A02020" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="280" y1="190" x2="300" y2="185" stroke="#A02020" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Projection intervals on axis (thick segments) -->
  <!-- A projection: min at ~(120,233), max at ~(265,180) -->
  <line x1="120" y1="233" x2="265" y2="180" stroke="#4A90D9" stroke-width="7"/>
  <text x="150" y="260" font-family="serif" font-size="13" fill="#2266AA" font-weight="bold">[min_A, max_A]</text>

  <!-- B projection: min at ~(300,185), max at ~(445,135) -->
  <line x1="300" y1="185" x2="445" y2="135" stroke="#D44" stroke-width="7"/>
  <text x="350" y="215" font-family="serif" font-size="13" fill="#A02020" font-weight="bold">[min_B, max_B]</text>

  <!-- Gap between projections -->
  <line x1="265" y1="180" x2="300" y2="185" stroke="#2A8A2A" stroke-width="3" marker-end="url(#arrowGreen)" marker-start="url(#arrowGreenStart)"/>
  <text x="265" y="300" font-family="serif" font-size="15" fill="#2A8A2A" font-weight="bold">gap &gt; 0 → axe séparateur !</text>

  <!-- Formula at bottom -->
  <rect x="30" y="320" width="520" height="30" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="280" y="340" text-anchor="middle" font-family="serif" font-size="14" fill="#333">Projection: proj(P) = P · n̂.  Intervalle = [min(proj), max(proj)] sur tous les sommets.</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2A8A2A"/>
    </marker>
    <marker id="arrowGreenStart" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#2A8A2A"/>
    </marker>
  </defs>
</svg>
