<svg width="560" height="320" viewBox="0 0 560 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- EPA (Expanding Polytope Algorithm): finding penetration depth after GJK -->

  <!-- Minkowski difference (faded) -->
  <polygon points="60,50 220,40 280,140 240,250 80,230 30,140" fill="#2A8A2A" fill-opacity="0.06" stroke="#2A8A2A" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.5"/>
  <text x="50" y="45" font-family="serif" font-size="13" fill="#2A8A2A" opacity="0.6">A ⊖ B (boundary)</text>

  <!-- Origin (inside) -->
  <circle cx="150" cy="150" r="5" fill="#D44" stroke="black" stroke-width="1.5"/>
  <text x="155" y="145" font-family="serif" font-size="14" fill="#D44" font-weight="bold">(0,0)</text>

  <!-- GJK simplex (triangle that contains origin) -->
  <polygon points="100,60 260,80 80,230" fill="#2266AA" fill-opacity="0.1" stroke="#2266AA" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="160" y="120" font-family="serif" font-size="12" fill="#2266AA">simplex GJK</text>

  <!-- EPA expanded polytope (closer to actual boundary) -->
  <polygon points="60,50 220,40 280,140 240,250 80,230" fill="none" stroke="#E8A838" stroke-width="2.5"/>
  <text x="200" y="200" font-family="serif" font-size="12" fill="#B07820">polytope EPA</text>

  <!-- Closest edge to origin (highlighted) -->
  <line x1="60" y1="50" x2="220" y2="40" stroke="#E8A838" stroke-width="5" opacity="0.6"/>
  <!-- Normal of closest edge -->
  <line x1="140" y1="45" x2="150" y2="145" stroke="#D44" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="155" y="100" font-family="serif" font-size="14" fill="#D44" font-style="italic" font-weight="bold">n̂</text>

  <!-- Penetration depth -->
  <line x1="140" y1="45" x2="150" y2="150" stroke="#D44" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="80" y="100" font-family="serif" font-size="13" fill="#D44" font-weight="bold">depth</text>

  <!-- New support point added by EPA (on the boundary) -->
  <circle cx="60" cy="50" r="5" fill="#E8A838" stroke="black" stroke-width="1.5"/>
  <circle cx="220" cy="40" r="5" fill="#E8A838" stroke="black" stroke-width="1.5"/>
  <circle cx="280" cy="140" r="5" fill="#E8A838" stroke="black" stroke-width="1.5"/>
  <circle cx="240" cy="250" r="5" fill="#E8A838" stroke="black" stroke-width="1.5"/>
  <circle cx="80" cy="230" r="5" fill="#E8A838" stroke="black" stroke-width="1.5"/>

  <!-- Explanation -->
  <rect x="310" y="50" width="230" height="200" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="320" y="72" font-family="serif" font-size="14" fill="#333" font-weight="bold">EPA — après GJK</text>
  <text x="320" y="95" font-family="serif" font-size="12" fill="#444">1. GJK dit "collision"</text>
  <text x="320" y="115" font-family="serif" font-size="12" fill="#444">   (origine dans simplex)</text>
  <text x="320" y="140" font-family="serif" font-size="12" fill="#444">2. EPA étend le simplex</text>
  <text x="320" y="160" font-family="serif" font-size="12" fill="#444">   vers la vraie frontière</text>
  <text x="320" y="185" font-family="serif" font-size="12" fill="#444">3. Trouve l'arête la plus</text>
  <text x="320" y="205" font-family="serif" font-size="12" fill="#444">   proche de l'origine</text>
  <text x="320" y="230" font-family="serif" font-size="12" fill="#D44" font-weight="bold">→ normale + profondeur</text>

  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D44"/>
    </marker>
  </defs>
</svg>
