<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="30" fill="#fff" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Euler vs RK4 — Orbite Circulaire</text>

  <!-- Left panel: Euler -->
  <text x="200" y="60" fill="#ff4444" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Euler (dérape)</text>
  <!-- Sun -->
  <circle cx="200" cy="220" r="8" fill="#FFCC00"/>
  <text x="200" y="245" fill="#FFCC00" font-family="Arial" font-size="10" text-anchor="middle">Soleil</text>
  <!-- Euler orbit — spiraling outward -->
  <path d="M 200,120
           C 280,120 320,170 320,220
           C 320,280 270,320 200,320
           C 120,320 70,280 70,220
           C 70,160 120,110 200,100
           C 300,100 360,160 360,220
           C 360,290 290,350 200,350
           C 90,350 30,290 30,220
           C 30,140 100,70 200,70
           C 330,70 410,150 410,220"
        fill="none" stroke="#ff4444" stroke-width="2" opacity="0.8"/>
  <!-- Planet -->
  <circle cx="410" cy="220" r="5" fill="#2277FF"/>

  <!-- Right panel: RK4 -->
  <text x="600" y="60" fill="#44ff44" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">RK4 (stable)</text>
  <!-- Sun -->
  <circle cx="600" cy="220" r="8" fill="#FFCC00"/>
  <text x="600" y="245" fill="#FFCC00" font-family="Arial" font-size="10" text-anchor="middle">Soleil</text>
  <!-- RK4 orbit — perfect circle, multiple overlapping -->
  <circle cx="600" cy="220" r="100" fill="none" stroke="#44ff44" stroke-width="2" opacity="0.8"/>
  <circle cx="600" cy="220" r="100" fill="none" stroke="#44ff44" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="220" r="100" fill="none" stroke="#44ff44" stroke-width="1" opacity="0.15"/>
  <!-- Planet -->
  <circle cx="700" cy="220" r="5" fill="#2277FF"/>

  <!-- Legend -->
  <text x="400" y="380" fill="#aaa" font-family="Arial" font-size="11" text-anchor="middle">
    Euler: l'orbite spirale vers l'extérieur (énergie croissante) — RK4: l'orbite reste circulaire (énergie conservée)
  </text>
</svg>
