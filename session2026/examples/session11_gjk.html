<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session 11 — GJK Visualizer</title>
    <style>
      body { margin: 0; overflow: hidden; }
      #info {
        position: fixed; top: 10px; left: 10px;
        color: #eee; font-family: 'Courier New', monospace; font-size: 13px;
        background: rgba(0,0,0,0.7); padding: 14px 18px; border-radius: 10px;
        pointer-events: none; max-width: 420px; line-height: 1.65; z-index: 10;
      }
      #info b { color: #fff; }
      #divider {
        position: fixed; top: 0; left: 50%; width: 2px; height: 100%;
        background: rgba(255,255,255,0.15); z-index: 5; pointer-events: none;
      }
      #labels {
        position: fixed; top: 10px; width: 100%; text-align: center;
        pointer-events: none; z-index: 5;
      }
      #labelLeft, #labelRight {
        display: inline-block; color: #aaa; font-family: 'Courier New', monospace;
        font-size: 14px; background: rgba(0,0,0,0.5); padding: 4px 16px;
        border-radius: 6px; margin: 0 8px;
      }
      #labelLeft { color: #88ccff; }
      #labelRight { color: #ffaa66; }
      #legend {
        position: fixed; bottom: 10px; left: 10px;
        color: #ccc; font-family: 'Courier New', monospace; font-size: 11px;
        background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px;
        pointer-events: none; z-index: 10;
      }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
          "jsm/": "https://unpkg.com/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="divider"></div>
    <div id="labels">
      <span id="labelLeft">World Space — Shapes A &amp; B</span>
      <span id="labelRight">Minkowski Space — A ⊖ B</span>
    </div>
    <div id="info"></div>
    <div id="legend">
      <span class="dot" style="background:#44aaff"></span>Polygon A &nbsp;
      <span class="dot" style="background:#ff8844"></span>Polygon B &nbsp;
      <span class="dot" style="background:#ffffff"></span>Origin &nbsp;
      <span class="dot" style="background:#00ff88"></span>Simplex &nbsp;
      <span class="dot" style="background:#ffff00"></span>Support pt &nbsp;
      <span class="dot" style="background:#ff00ff"></span>Direction d
    </div>
    <script type="module" src="session11_gjk.js"></script>
  </body>
</html>
